# The project name is pinned so the volume and container names do not depend on the folder name.
name: recallkeep

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      # Loopback only: the default password is public, so never publish this on the LAN.
      - "127.0.0.1:${RECALLKEEP_DB_PORT:-5433}:5432"
      - "[::1]:${RECALLKEEP_DB_PORT:-5433}:5432"
    volumes:
      - recallkeep-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: recallkeep
      POSTGRES_USER: recallkeep
      POSTGRES_PASSWORD: ${RECALLKEEP_DB_PASSWORD:-recallkeep_secret}
    healthcheck:
      test: pg_isready -U recallkeep -d recallkeep
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  recallkeep-db-data:
